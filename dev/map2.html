<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Samples Map and Table</title>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- jQuery and DataTables -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        #map {
            height: 600px;
        }
        #sampleTable {
            margin-top: 50px;
            width: 100%;
        }
    </style>
</head>
<body>

<h1>Samples Map</h1>
<div id="map"></div>

<h2>Samples Table</h2>
<table id="sampleTable" class="display">
    <thead>
        <tr>
            <th>SampleID</th>
            <th>LocationID</th>
            <th>SampleType</th>
            <th>Value</th>
        </tr>
    </thead>
    <tbody>
        <!-- Table rows will be inserted here -->
    </tbody>
</table>

<script>
    // Plotly map data
    var mapData = [{
        type: 'scattermapbox',
        lat: ['37.7749', '34.0522', '40.7128', '41.8781', '47.6062'],
        lon: ['-122.4194', '-118.2437', '-74.0060', '-87.6298', '-122.3321'],
        text: ['SAMP001', 'SAMP003', 'SAMP004', 'SAMP006', 'SAMP007'],
        mode: 'markers',
        marker: { size: 12, color: 'blue' }
    }];

    var mapLayout = {
        mapbox: {
            style: 'open-street-map',
            center: { lat: 39, lon: -98 },
            zoom: 3
        },
        margin: { t:0, b:0, l:0, r:0 },
        height: 600
    };

    Plotly.newPlot('map', mapData, mapLayout);

    // Table data
    var tableData = [
        {SampleID: 'SAMP001', LocationID: 'LOC001', SampleType: 'Water', Value: 7.1},
        {SampleID: 'SAMP002', LocationID: 'LOC001', SampleType: 'Soil', Value: 5.5},
        {SampleID: 'SAMP003', LocationID: 'LOC002', SampleType: 'Water', Value: 8.3},
        {SampleID: 'SAMP004', LocationID: 'LOC003', SampleType: 'Air', Value: 3.2},
        {SampleID: 'SAMP005', LocationID: 'LOC003', SampleType: 'Water', Value: 6.8},
        {SampleID: 'SAMP006', LocationID: 'LOC004', SampleType: 'Soil', Value: 4.9},
        {SampleID: 'SAMP007', LocationID: 'LOC005', SampleType: 'Air', Value: 2.5},
    ];

    // Insert rows into the table
    $(document).ready(function() {
        var tableBody = $('#sampleTable tbody');
        tableData.forEach(function(row) {
            tableBody.append(
                `<tr>
                    <td>${row.SampleID}</td>
                    <td>${row.LocationID}</td>
                    <td>${row.SampleType}</td>
                    <td>${row.Value}</td>
                </tr>`
            );
        });

        // Activate DataTables
        $('#sampleTable').DataTable();
    });
</script>

</body>
</html>
